name: L0 scoped native delivery
on:
  push:
    branches: [dev-20260924-l0-delivery]
    paths: [.github/l0-delivery.json]
permissions:
  contents: read
jobs:
  deliver:
    runs-on: macos-26
    timeout-minutes: 15
    concurrency:
      group: l0-scoped-publication
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.publish.outputs.candidate }}
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Prepare pinned formatter
        run: rustup toolchain install 1.92.0 --profile minimal --component rustfmt
      - name: Verify, apply, format and publish the reviewed patch
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, io, json, os, pathlib, re, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert os.environ['GITHUB_REF'] == 'refs/heads/dev-20260924-l0-delivery'
          spec = json.loads(pathlib.Path('.github/l0-delivery.json').read_text())
          assert spec['target'] == 'dev-20260924-l0'
          patch_base = spec.get('patch_base', spec['base'])
          assert re.fullmatch('[0-9a-f]{40}', spec['base'])
          assert re.fullmatch('[0-9a-f]{40}', patch_base)
          paths = spec['paths']
          assert paths and len(paths) == len(set(paths))
          for path in paths:
              p = pathlib.PurePosixPath(path)
              assert not p.is_absolute() and '..' not in p.parts
              assert p.parts[0] in {'app', 'crates', 'docs', 'script', 'test-data', 'verification'}
              assert path not in {'test-data/localization/phase1-before.txt', 'test-data/localization/deleted-test-ids.txt'}
              assert 'migrations' not in p.parts
          packed = base64.b64decode(spec['patch_gzip_base64'], validate=True)
          with gzip.GzipFile(fileobj=io.BytesIO(packed)) as stream:
              patch = stream.read(2 * 1024 * 1024 + 1)
          assert len(patch) <= 2 * 1024 * 1024
          assert hashlib.sha256(patch).hexdigest() == spec['sha256']
          patch_path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'reviewed-l0.patch'
          patch_path.write_bytes(patch)
          git('fetch', '--depth=50', 'origin', spec['target'])
          actual = git('rev-parse', 'FETCH_HEAD')
          assert actual == spec['base'], f'Branch moved: expected {spec["base"]}, got {actual}'
          subprocess.run(['git', 'merge-base', '--is-ancestor', patch_base, actual], check=True)
          git('checkout', '--detach', patch_base)
          subprocess.run(['git', 'apply', '--check', '--whitespace=error', str(patch_path)], check=True)
          subprocess.run(['git', 'apply', '--index', '--whitespace=error', str(patch_path)], check=True)
          changed = set(git('diff', '--cached', '--name-only').splitlines())
          assert changed == set(paths), (changed, paths)
          subprocess.run(['cargo', '+1.92.0', 'fmt', '--all'], check=True)
          changed |= set(git('diff', '--name-only').splitlines())
          assert changed <= set(paths), f'Formatter changed undeclared paths: {changed - set(paths)}'
          subprocess.run(['git', 'add', '--', *paths], check=True)
          # The reviewed cumulative tree includes previous deliveries. Preserve the current
          # branch tip as the parent; never rewind or force-update the product branch.
          git('reset', '--soft', actual)
          net_paths = set(git('diff', '--cached', '--name-only').splitlines())
          assert net_paths and net_paths <= set(paths)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          git('config', 'user.name', 'github-actions[bot]')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          git('commit', '-m', spec['message'])
          candidate = git('rev-parse', 'HEAD')
          tree = git('rev-parse', 'HEAD^{tree}')
          subprocess.run(['git', 'push', 'origin', f'HEAD:refs/heads/{spec["target"]}'], check=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'candidate={candidate}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(f'Parent: `{actual}`\n\nPatch base: `{patch_base}`\n\nPatch SHA256: `{spec["sha256"]}`\n\nCandidate: `{candidate}`\n\nTree: `{tree}`\n\nFormatting completed; product tests are reported separately.\n')
          print('Published candidate', candidate, 'tree', tree)
          PY
  native-validation:
    needs: deliver
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: 3
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -C debuginfo=line-tables-only --cfg=web_sys_unstable_apis
      WARPUI_USE_REAL_DISPLAY_IN_INTEGRATION_TESTS: '1'
      WARP_SHELL_PATH: /bin/zsh
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ needs.deliver.outputs.candidate }}
          persist-credentials: false
      - name: Freeze native candidate sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          mkdir -p verification/ci-l0
          git rev-parse HEAD > verification/ci-l0/source-head.txt
          sw_vers > verification/ci-l0/platform.txt
          GIT_LFS_SKIP_SMUDGE=1 git archive --format=tar.gz HEAD > verification/ci-l0/candidate-source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: l0-native-source-${{ needs.deliver.outputs.candidate }}
          path: verification/ci-l0/
          retention-days: 7
          if-no-files-found: error
      - name: Materialize retained resources and native tools
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --exclude='crates/input_classifier/models/**,*.pdb'
          ./script/macos/install_build_deps
          HOMEBREW_NO_AUTO_UPDATE=1 brew install protobuf fish bash
      - uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419
        with:
          tool: nextest
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-on-failure: true
      - name: Native compilation
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked -p warp --all-targets --tests --no-default-features --features local_only 2>&1 | tee verification/ci-l0/gui-check.log
      - name: Focused and full local app tests
        shell: bash
        run: |
          set -euo pipefail
          cargo nextest run --locked --no-fail-fast -p warp --no-default-features --features local_only,test-util -E 'test(l0_)' 2>&1 | tee verification/ci-l0/l0-tests.log
          cargo nextest run --locked --no-fail-fast -p warp --no-default-features --features local_only,test-util 2>&1 | tee verification/ci-l0/app-tests.log
      - name: Native strict Clippy and retained inventory
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked -p warp --all-targets --tests --no-default-features --features local_only -- -D warnings 2>&1 | tee verification/ci-l0/clippy-local.log
          ./script/test_inventory 2>&1 | tee verification/ci-l0/inventory.log
      - name: Full existing presubmit gates
        shell: bash
        run: |
          set -euo pipefail
          ./script/presubmit 2>&1 | tee verification/ci-l0/presubmit.log
      - name: Preserve source and native results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: l0-native-${{ needs.deliver.outputs.candidate }}
          path: verification/ci-l0/
          retention-days: 30
          if-no-files-found: error
