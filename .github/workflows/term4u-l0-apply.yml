name: Apply reviewed L0 candidate

on:
  push:
    branches: [dev-20260920]
    paths: [.github/workflows/term4u-l0-apply.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/dev-20260920'
    runs-on: macos-26
    timeout-minutes: 15
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 2
      - name: Verify the base and assemble the reviewed patches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          test "$(git rev-parse HEAD^)" = bbcf5f95adc3024fe6f6aceb3a872362c12aa938
          mkdir -p "$RUNNER_TEMP/l0-evidence"
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, urllib.request
          parts = {
              'docs': ('c2b499cc3c280404fa265733b2fb69dc6b37b6c2c1a7705ff3a90ccfcc5f6ff9', [
                  'beb71b0122e23d86a408cb0b56706dc0ee07fb70',
                  '33da4a5d361780cb24cbc47d6403a874046521c9',
                  'b3101b62fddd5da80c1cc299d14101936043cad9',
                  'cc47018d20d54bccac8c5d78433c23ef748cd1fd',
                  '42e44589a8df70f1fa039fd7b859572326247e50',
                  '18fe1247237f7472b5a84cbe14e5a6e015db3d14',
                  'd4f704ec63c5088f3d6efe82619ce9043cb363f6',
                  '510feed78b38c0f047aeb67697b7e9b052f19f25',
                  '41b47641b426eb3778de544e49f1c5001936cef9']),
              'code': ('7fec195b11f703ef67e8347c2eee2bda91b36fa04f8a44a48cd053deaf0220ce', [
                  'f3dafec00fbb7cacd04d929ef3202c876391a464',
                  '316c7eb6966bdf10609866dcc8c17d35de3a75c6',
                  '33ffc13216c9ae2e71e253a2f9de33eab3c2284a'])}
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'l0-evidence'
          for name, (digest, shas) in parts.items():
              chunks = []
              for sha in shas:
                  request = urllib.request.Request(
                      f'https://api.github.com/repos/tedczj/term4u/git/blobs/{sha}',
                      headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                               'Accept': 'application/vnd.github+json'})
                  with urllib.request.urlopen(request, timeout=60) as response:
                      obj = json.load(response)
                  data = base64.b64decode(obj['content'])
                  assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
                  chunks.append(data)
              patch = gzip.decompress(b''.join(chunks))
              assert hashlib.sha256(patch).hexdigest() == digest, name
              (root / (name + '.patch')).write_bytes(patch)
              print(name, digest, len(patch))
          PY
      - name: Commit the sole design and the native-formatted implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'term4u development automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git apply --check "$RUNNER_TEMP/l0-evidence/docs.patch"
          git apply --index "$RUNNER_TEMP/l0-evidence/docs.patch"
          git diff --cached --check
          git commit -m 'docs(l0): integrate executable preservation design and Apple Silicon-only scope'
          git apply --check "$RUNNER_TEMP/l0-evidence/code.patch"
          git apply --index "$RUNNER_TEMP/l0-evidence/code.patch"
          rustup show
          ./script/format
          ./script/format --check
          git diff --check
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          assert len(paths) <= 40, 'Unexpected broad formatting changes'
          assert all(p.endswith('.rs') for p in paths), paths
          PY
          git add -u
          git diff --cached --check
          git commit -m 'feat(l0): preserve local paste, file drops, IME, OSC52 and deferred focus with integration tests'
          python3 script/lib/test_inventory_tests.py 2>&1 | tee "$RUNNER_TEMP/l0-evidence/inventory-unit-tests.log"
          git log -3 --format='%H %s' > "$RUNNER_TEMP/l0-evidence/commits.txt"
          git diff "$GITHUB_SHA" HEAD --stat > "$RUNNER_TEMP/l0-evidence/change-stat.txt"
          git diff "$GITHUB_SHA" HEAD > "$RUNNER_TEMP/l0-evidence/formatted.patch"
          git rev-parse HEAD > "$RUNNER_TEMP/l0-evidence/source-head.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/l0-evidence/candidate-source.tar.gz"
          remote_head="$(git ls-remote origin refs/heads/dev-20260920 | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/dev-20260920
      - name: Preserve the exact candidate and apply evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: l0-applied-${{ github.sha }}
          path: ${{ runner.temp }}/l0-evidence/
          retention-days: 7
          if-no-files-found: error
