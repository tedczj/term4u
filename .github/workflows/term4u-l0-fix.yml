name: Apply L0 compile fixes

on:
  push:
    branches: [dev-20260920]
    paths: [.github/workflows/term4u-l0-fix.yml]

permissions:
  contents: write

jobs:
  fix:
    if: github.ref == 'refs/heads/dev-20260920'
    runs-on: macos-26
    timeout-minutes: 10
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 2
      - name: Apply exact reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test "$(git rev-parse HEAD^)" = 5b22243026ead9aef9fb73eb2380822f1af3e50d
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              assert s.count(old) == 1, (path, old)
              p.write_text(s.replace(old, new))
          replace('app/src/terminal/view.rs',
                  'use std::borrow::Cow;\n',
                  'use std::borrow::Cow;\nuse std::path::PathBuf;\n')
          replace('app/src/terminal/view/local_io_tests.rs',
                  'use warpui::{App, EntityIdSet, Event as UiEvent, ViewHandle, WindowId, WindowInvalidation};',
                  'use warpui::{\n    App, EntityIdSet, Event as UiEvent, TypedActionView, ViewHandle, WindowId, WindowInvalidation,\n};')
          replace('docs/DESIGN.md', '| ID | 当前可确认的进度 | 本轮完成出口 |',
                  '| ID | 审查基线时可确认的进度（当前分支见 §6.2.15） | 本轮完成出口 |')
          replace('docs/DESIGN.md',
                  '**已取得的候选证据（不是本轮全部修复的 PASS）：**',
                  '**已取得的候选证据（不是本轮全部修复的 PASS）：**\n\n'
                  '- `8abea95f3e4121a69fd79cb6155a854344ad1f97` 已提交完整 L0 设计；'
                  '`6cda3cee60fd3cb51a9dc39a22423622ded24c40` 已提交本轮实现和 11 个新增测试。'
                  '原生 apply run `35569723579` 的格式化、格式检查和 inventory 工具 9 项单测 PASS。\n'
                  '- `5b22243026ead9aef9fb73eb2380822f1af3e50d`，macOS ARM run `35569900836`：'
                  '格式、独立测试布局、许可证边界/配置、网络边界和 inventory 工具单测 PASS；'
                  'GUI 编译发现生产代码缺 `PathBuf` 导入、测试缺 `TypedActionView` 导入，'
                  'Rust 集成测试因此 NOT_RUN。当前增量补上这两处导入，不修改测试断言；'
                  '修复候选仍须重新验证，不能沿用旧候选 PASS。')
          PY
          ./script/format
          ./script/format --check
          git diff --check
          git diff --stat
          git config user.name 'term4u development automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/terminal/view.rs app/src/terminal/view/local_io_tests.rs docs/DESIGN.md
          test -z "$(git diff --name-only)"
          git commit -m 'fix(l0): import native path and action traits and record candidate evidence'
          test "$(git ls-remote origin refs/heads/dev-20260920 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/dev-20260920
