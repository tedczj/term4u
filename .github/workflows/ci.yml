name: Warp CI

on:
  pull_request:
    branches:
      - master
      - '*_release/*'
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NEXTEST_PROFILE: ci
  WORKSPACE_TEST_ARGS: --workspace --locked --exclude command-signatures-v2
  RUSTFLAGS: -C debuginfo=line-tables-only --cfg=web_sys_unstable_apis
  WARPUI_USE_REAL_DISPLAY_IN_INTEGRATION_TESTS: 1

jobs:
  params:
    name: Compute workflow parameters
    timeout-minutes: 3
    runs-on: ubuntu-latest
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (!startsWith(github.event.pull_request.head.ref, 'repo-sync/') || contains(github.event.pull_request.labels.*.name, 'repo-sync:conflict'))
    outputs:
      affects-database-schema: ${{ github.ref == 'refs/heads/master' || steps.filter.outputs.affects-database-schema }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Check changed files
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            affects-database-schema:
              - 'crates/persistence/src/schema.rs'
              - 'crates/persistence/migrations/**'

  tests:
    name: Run ${{ matrix.name }} tests
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            name: macOS
            runner: macos-latest
          - os: linux
            name: Linux
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    needs: params
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: ${{ matrix.os }}
          is_self_hosted: false
          install_test_deps: true

      - name: Install shells
        uses: ConorMacBride/install-package@3e7ad059e07782ee54fa35f827df52aae0626f30 # v1
        with:
          apt: zsh fish
          brew: fish bash

      - name: Discover shells
        id: shells
        shell: bash
        run: |
          DEFAULT_BASH_PATH="$(command -pv bash)"
          echo "default_bash_path=$DEFAULT_BASH_PATH" >> "$GITHUB_OUTPUT"
          echo "zsh_path=$(command -v zsh)" >> "$GITHUB_OUTPUT"
          echo "fish_path=$(command -v fish)" >> "$GITHUB_OUTPUT"
          if [ "${{ matrix.os }}" = "macos" ]; then
            echo "latest_bash_path=$(brew --prefix bash)/bin/bash" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cargo nextest
        uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2.82.7
        with:
          tool: nextest

      - name: Install vim for richer alt-screen tests
        uses: ConorMacBride/install-package@3e7ad059e07782ee54fa35f827df52aae0626f30 # v1
        with:
          brew: vim
          apt: vim

      - name: Compile tests
        run: cargo nextest run ${{ env.WORKSPACE_TEST_ARGS }} --no-run

      - name: Run unit tests
        run: cargo nextest run ${{ env.WORKSPACE_TEST_ARGS }} -E "not package(integration)"
        env:
          WARP_SHELL_PATH: ${{ steps.shells.outputs.zsh_path }}

      - name: Run shell-agnostic integration tests
        uses: coactions/setup-xvfb@b6b4fcfb9f5a895edadc3bc76318fae0ac17c8b3 # v1
        with:
          run: cargo nextest run ${{ env.WORKSPACE_TEST_ARGS }} -E "package(integration) and not test(shell_integration_tests)"
        env:
          WARP_SHELL_PATH: ${{ steps.shells.outputs.zsh_path }}

      - name: Run shell integration tests against default Bash
        uses: coactions/setup-xvfb@b6b4fcfb9f5a895edadc3bc76318fae0ac17c8b3 # v1
        with:
          run: cargo nextest run ${{ env.WORKSPACE_TEST_ARGS }} -E "package(integration) and test(shell_integration_tests)"
        env:
          WARP_SHELL_PATH: ${{ steps.shells.outputs.default_bash_path }}

      - name: Run shell integration tests against latest Bash
        if: matrix.os == 'macos'
        uses: coactions/setup-xvfb@b6b4fcfb9f5a895edadc3bc76318fae0ac17c8b3 # v1
        with:
          run: cargo nextest run ${{ env.WORKSPACE_TEST_ARGS }} -E "package(integration) and test(shell_integration_tests)"
        env:
          WARP_SHELL_PATH: ${{ steps.shells.outputs.latest_bash_path }}

      - name: Run shell integration tests against fish
        uses: coactions/setup-xvfb@b6b4fcfb9f5a895edadc3bc76318fae0ac17c8b3 # v1
        with:
          run: cargo nextest run ${{ env.WORKSPACE_TEST_ARGS }} -E "package(integration) and test(shell_integration_tests)"
        env:
          WARP_SHELL_PATH: ${{ steps.shells.outputs.fish_path }}

      - name: Run shell integration tests against zsh
        uses: coactions/setup-xvfb@b6b4fcfb9f5a895edadc3bc76318fae0ac17c8b3 # v1
        with:
          run: cargo nextest run ${{ env.WORKSPACE_TEST_ARGS }} -E "package(integration) and test(shell_integration_tests)"
        env:
          WARP_SHELL_PATH: ${{ steps.shells.outputs.zsh_path }}

      - name: Run doc tests
        run: cargo test ${{ env.WORKSPACE_TEST_ARGS }} --doc

      - name: Run completions-on-js tests
        uses: coactions/setup-xvfb@b6b4fcfb9f5a895edadc3bc76318fae0ac17c8b3 # v1
        with:
          run: cargo nextest run --locked -p warp_completer --features v2

  database-migration:
    name: Database Migration (Diesel)
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: params
    if: ${{ needs.params.outputs.affects-database-schema == 'true' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install cargo-binstall
        run: ./script/install_cargo_binstall

      - name: Install diesel_cli
        run: cargo binstall diesel_cli

      - name: Run all migrations and verify the generated schema
        shell: bash
        run: |
          cp crates/persistence/src/schema.rs old-schema.rs
          diesel migration run --database-url="test.sqlite" --migration-dir="crates/persistence/migrations"
          diff -u old-schema.rs <(diesel print-schema --database-url="test.sqlite")

  lints:
    name: Formatting + Clippy (${{ matrix.name }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            name: macOS
            runner: macos-latest
          - os: linux
            name: Linux
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    needs: params
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: ${{ matrix.os }}
          is_self_hosted: false

      - name: Ensure Cargo.lock is up to date
        run: cargo metadata --locked --format-version=1 >/dev/null

      - name: Check formatting
        run: ./script/format --check

      - name: Check network boundaries
        run: ./script/check_network_boundaries

      - name: Run Clippy
        run: |
          cargo clippy --locked --workspace --exclude warp_completer --all-targets --tests -- -D warnings
          cargo clippy --locked -p warp --all-targets --tests -- -D warnings
          cargo clippy --locked -p warp_completer --all-targets --tests -- -D warnings

      - name: Run clang-format
        if: matrix.os == 'macos'
        run: ./script/run-clang-format.py -r --extensions 'c,h,cpp,m' ./crates/warpui/src/ ./app/src/

  general-lint:
    name: Miscellaneous checks
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: params
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install cargo-binstall
        run: ./script/install_cargo_binstall

      - name: Check dependency licenses
        run: |
          cargo binstall --force -y cargo-deny
          cargo deny -L error check licenses

      - name: Check license configuration
        run: ./script/check_license_config_sync

      - name: Check WGSL formatting
        run: |
          cargo install --git https://github.com/wgsl-analyzer/wgsl-analyzer --tag "2025-06-28" wgslfmt
          find . -name "*.wgsl" -exec wgslfmt --check {} +

      - name: Check Rust test module layout
        run: ./script/check_no_inline_test_modules

  wasm-lint:
    name: Formatting + Clippy (wasm)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs: params
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: wasm
          is_self_hosted: false

      - name: Ensure Cargo.lock is up to date
        run: cargo metadata --locked --format-version=1 >/dev/null

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --locked --target wasm32-unknown-unknown --profile release-wasm-debug_assertions -- -D warnings

  check-release-compilation:
    name: Verify compilation with release flags (${{ matrix.name }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            name: macOS
            runner: macos-latest
          - os: linux
            name: Linux
            runner: ubuntu-latest
          - os: wasm
            name: wasm
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    needs: params
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: ${{ matrix.os }}
          is_self_hosted: false

      - name: Verify compilation with release flags
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "wasm" ]; then
            ./script/wasm/bundle --channel oss --nouniversal --check-only
          else
            ./script/bundle --channel oss --nouniversal --check-only
          fi

  ci-result:
    name: Check CI results
    timeout-minutes: 3
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    needs:
      - params
      - database-migration
      - tests
      - lints
      - wasm-lint
      - general-lint
      - check-release-compilation
    steps:
      - name: Check required jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -e '
            to_entries
            | map(select(.key != "database-migration"))
            | all(.value.result == "success")
          '
          echo "$NEEDS" | jq -e '
            .["database-migration"].result == "success"
            or .["database-migration"].result == "skipped"
          '
